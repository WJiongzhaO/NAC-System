# ============================================================
# NAC-System 配置文件 — A.2 级联式造船语音问答系统（轻量方案）
# ============================================================

# --- ASR 模块 (paraformer-zh-streaming-v2) ---
asr:
  model_id: "paraformer-zh"              # 离线整段（基线）
  streaming_model_id: "paraformer-zh-streaming"  # 在线 chunk 流式
  device: "cpu"                # 轻量模型 CPU 即可；GPU 可选 "cuda:0"
  language: "zh"
  use_itn: true                # 逆文本正则化
  # 流式 chunk：[0,10,5] = 600ms 步进 + 300ms 前瞻（FunASR 官方默认）
  streaming_chunk_size: [0, 10, 5]
  encoder_chunk_look_back: 4
  decoder_chunk_look_back: 1
  # VAD 配置（内置 FSMN-VAD，仅离线 model_id 使用）
  vad_model: "fsmn-vad"
  vad_max_segment_time: 30000  # 单段最大时长 (ms)
  # 热词配置（用于改进阶段，格式: "词1,词2,词3"）
  hotword: ""
  hotwords_file: "data/hotwords.txt"

# --- LLM 模块 (DeepSeek-V4-Flash) ---
llm:
  api_base: "https://api.deepseek.com"
  api_key: "${DEEPSEEK_API_KEY}"
  model: "deepseek-v4-flash"
  max_tokens: 2048
  temperature: 0.7
  stream: false                # 基线模式关闭流式
  system_prompt: |
    你是一个专业的造船领域安全问答助手。你需要：
    1. 用简洁、专业的中文回答与船舶制造、船体结构、焊接工艺、
       船舶安全规范等相关的问题。
    2. 如果问题涉及不安全操作，请明确指出风险并给出安全建议。
    3. 如果问题超出造船领域范围，请礼貌说明你只能回答造船相关问题。
    4. 回答控制在 3~5 句以内，适合语音播报的长度。

# --- TTS 模块 (Edge-TTS 主引擎 + Piper 兜底) ---
tts:
  # —— 引擎选择（优化方向 C：引擎升级）——
  # edge  : 主用微软 Edge-TTS（在线，中文原生声调建模，音质工业级），
  #         初始化/合成失败(断网/超时)时自动降级到 Piper，链路永不中断。
  # piper : 纯离线，仅用 Piper（无网络环境）。
  engine: "edge"
  enable_fallback: true              # engine=edge 时，是否启用 Piper 兜底
  # —— Edge-TTS 参数（engine=edge 生效）——
  voice: "zh-CN-YunjianNeural"       # 云健：沉稳专业男声(默认)；云扬=YunyangNeural
  rate: "-5%"                        # 语速，负值更沉稳
  volume: "+0%"
  pitch: "+0Hz"
  proxy: ""                          # 可选 HTTPS 代理；留空走系统 HTTPS_PROXY
  # —— Piper 参数（engine=piper，或作为 edge 兜底时生效）——
  model_name: "zh_CN-huayan-medium"   # Piper 中文语音包
  # 模型自动下载到 piper 缓存目录
  device: "cpu"                      # ONNX Runtime，CPU 即可实时合成
  # 流式配置
  stream: false                      # 基线模式关闭流式
  sample_rate: 22050                 # Piper 原生输出采样率
  # SSML 配置（改进阶段启用）
  ssml_enabled: false
  ssml_lexicon: "data/ssml_lexicon.json"
  # —— 优化方向 A：文本前端规整 (TN) ——
  text_normalize: true                 # 合成前做术语/数字/单位/符号规整
  tn_lexicon_path: "data/tn_lexicon.json"   # 造船术语读音扩展词典(可选)
  # —— 优化方向 B：推理加速 / 量化 ——
  use_quantized_model: false           # 为 true 时优先加载 *.int8.onnx
  quantized_model_path: "pretrained_models/piper/zh_CN-huayan-medium.int8.onnx"
  intra_op_threads: 0                  # 0 = 自动取 CPU 核数
  inter_op_threads: 1                  # TTS 单流推理建议 1

# --- 安全门控模块 ---
safety:
  enabled: true
  blocked_keywords:
    - "炸弹"
    - "武器"
    - "攻击"
    - "黑客"
    - "恶意代码"
  safe_response_text: "抱歉，您的问题涉及不安全内容，我无法回答。请询问造船安全相关的问题。"

# --- 管道配置 ---
pipeline:
  audio:
    sample_rate: 16000
    channels: 1
    format: "wav"
  output:
    sample_rate: 22050    # Piper 原生输出采样率
    format: "wav"
  measure_latency: true

# --- 评测配置 ---
eval:
  test_audio_dir: "data/test_audio"
  output_dir: "output"
  metrics:
    - "asr_latency"
    - "llm_ttft"
    - "tts_first_packet"
    - "total_latency"
